[package]
name = "sudo-rs"
description = "A memory safe implementation of sudo and su."
version = "0.2.15"
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/trifectatechfoundation/sudo-rs"
homepage = "https://github.com/trifectatechfoundation/sudo-rs"
publish = true
categories = ["command-line-interface"]
exclude = ["audit", "proofs", "util"]

rust-version = "1.85"

default-run = "sudo"

[dependencies]
libc = "0.2.176"
glob = "0.3.0"

# OxideBSD: its PAM modules are Rust, linked in (no dlopen of modules), in the OxideBSD tree's
# lib/libpam, which also defines OpenPAM's openpam_static_modules table.
[target.'cfg(target_os = "oxidebsd")'.dependencies]
oxidebsd-pam = { package = "pam", path = "../../../lib/libpam" }

[features]
default = []

# when enabled, use "sudo-i" PAM service name for sudo -i instead of "sudo"
# ONLY ENABLE THIS FEATURE if you know that original sudo uses "sudo-i"
# on the system you are building sudo for (e.g. Debian, Fedora, but not Arch)
pam-login = []

# this enables enforcing of AppArmor profiles
apparmor = []

# whether to enable 'gettext' support for giving localized user-facing messages
gettext = []

# whether to enable the unstable '@socket' feature for fetching a remote sudoers
unstable-remote-sudoers = []

# enable detailed logging (use for development only) to /tmp
# this will compromise the security of sudo-rs somewhat
dev = []

# this feature should never be enabled, but it is here to prevent accidental
# compilation using "cargo --all-features", which should not be used on sudo-rs
do-not-use-all-features = []

[profile.release]
strip = "symbols"
lto = true
opt-level = "s"

# OxideBSD: the libc crate fork that knows target_os = "oxidebsd", and a workspace of its own
# (sudo-rs lives inside the OxideBSD tree at external/mit/sudo-rs, but isn't one of its members).
[patch.crates-io]
libc = { git = "https://github.com/OxideBSD/libc-crate-oxidebsd.git", branch = "oxidebsd" }

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = { level = "deny" }

[lints.clippy]
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
